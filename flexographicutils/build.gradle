dependencies {
  compileOnly jsr305() // javax.annotation.Nonnull / Nullable
  api project(':flexolocalization')

  implementation flexoUtils()

  implementation(batikCodec()) {
       exclude group: "xml-apis", module: "xml-apis"
  }

  api gson()
  api group: 'org.swinglabs.swingx', name: 'swingx-core', version: '1.6.5-1'

  //api group: 'com.fifesoft', name: 'rsyntaxtextarea', version: '2.6.1'
  api group: 'com.fifesoft', name: 'rsyntaxtextarea', version: '3.6.3'
  api group: 'com.fifesoft', name: 'autocomplete', version: '3.3.3'
  api group: 'com.fifesoft', name: 'rstaui', version: '3.3.2'
  api group: 'com.fifesoft', name: 'languagesupport', version: '3.4.1'
  
}

