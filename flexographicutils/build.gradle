dependencies {
  implementation guava() // used directly; no longer provided by connie-core
  compileOnly jsr305() // javax.annotation.Nonnull / Nullable
  api project(':flexolocalization')

  implementation flexoUtils()

  implementation(batikCodec()) {
       exclude group: "xml-apis", module: "xml-apis"
  }

  api gson()
  api 'org.swinglabs.swingx:swingx-core:1.6.5-1'

  //api group: 'com.fifesoft', name: 'rsyntaxtextarea', version: '2.6.1'
  api 'com.fifesoft:rsyntaxtextarea:3.6.3'
  api 'com.fifesoft:autocomplete:3.3.3'
  api 'com.fifesoft:rstaui:3.3.2'
  api 'com.fifesoft:languagesupport:3.4.1'
  
}

